<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Trace Viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🔍%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/sidebar.css">
<link rel="stylesheet" href="css/panels.css">
<link rel="stylesheet" href="css/steps.css">
<link rel="stylesheet" href="css/format.css">
<link rel="stylesheet" href="css/analysis.css">
<link rel="stylesheet" href="css/chart.css">
<link rel="stylesheet" href="css/calendar.css">
</head>
<body>

<header>
  <h1>Trace Viewer</h1>
  <div class="header-controls">
    <input type="text" id="searchInput" placeholder="搜索 runs ...">
    <button class="btn" id="traceCalBtn">📅 日历</button>
    <label class="btn" style="cursor:pointer">
      Load JSON
      <input type="file" id="fileInput" accept=".json" hidden>
    </label>
    <button class="btn" id="clearBtn">Clear</button>
  </div>
</header>

<aside id="sidebar">
  <div id="runList"></div>
</aside>

<section id="content">
  <div class="placeholder" id="placeholder">
    拖拽 JSON 文件到此处，或点击 Load JSON 加载
  </div>
  <div id="run-header" class="run-header" style="display:none"></div>
  <div id="left-panel" style="display:none"></div>
  <div id="right-panel" style="display:none"></div>

  <div class="detail-drawer" id="detailDrawer">
    <div class="drawer-header">
      <h3 id="drawerTitle">节点详情</h3>
      <button class="drawer-close" id="drawerClose">&times;</button>
    </div>
    <div class="drawer-tabs">
      <div class="drawer-tab active" data-tab="overview">概览</div>
      <div class="drawer-tab" data-tab="input">输入</div>
      <div class="drawer-tab" data-tab="output">输出</div>
      <div class="drawer-tab" data-tab="messages">消息</div>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </div>
</section>

<div class="drop-overlay" id="dropOverlay">释放文件以加载</div>

<!-- Trace Calendar Modal -->
<div class="trace-calendar-overlay" id="traceCalOverlay">
  <div class="trace-calendar-modal" id="traceCalModal">
    <div class="trace-cal-header">
      <h2>📅 Trace 日历</h2>
      <div class="trace-cal-nav">
        <button id="traceCalPrevYear" title="上一年">«</button>
        <button id="traceCalPrevMonth" title="上月">‹</button>
        <span class="trace-cal-title"><span id="traceCalYear"></span> <span id="traceCalMonth"></span></span>
        <button id="traceCalNextMonth" title="下月">›</button>
        <button id="traceCalNextYear" title="下年">»</button>
      </div>
      <button class="trace-cal-close" id="traceCalClose">&times;</button>
    </div>
    <div class="trace-cal-body" id="traceCalBody"></div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/api.js"></script>
<script src="js/format.js"></script>
<script src="js/analysis.js"></script>
<script src="js/render.js"></script>
<script src="js/calendar.js"></script>
</body>
</html>
